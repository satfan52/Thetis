name: Build and publish Branch D designer UI fix

on:
  push:
    branches:
      - ci/baseline-build
    paths:
      - .github/workflows/publish-hybrid-sdr-d.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-build-publish:
    name: Declare, rebuild, and publish Branch D UI
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout current Branch D
        uses: actions/checkout@v4
        with:
          ref: feature/dedicated-processed-tx-output
          fetch-depth: 0
          path: source

      - name: Move TX Output page into Setup designer
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          expected = "1bbb590bae121fdb1173b3f7ba4a50ac37a74c8a"
          actual = subprocess.check_output(
              ["git", "-C", "source", "rev-parse", "HEAD"], text=True
          ).strip()
          if actual != expected:
              raise RuntimeError(f"Branch D moved unexpectedly: {actual}")

          def read(path):
              raw = path.read_bytes()
              return raw, raw.decode("utf-8-sig").replace("\r\n", "\n")

          def write(path, raw, text):
              eol = "\r\n" if b"\r\n" in raw else "\n"
              encoded = text.replace("\n", eol).encode("utf-8")
              if raw.startswith(b"\xef\xbb\xbf"):
                  encoded = b"\xef\xbb\xbf" + encoded
              path.write_bytes(encoded)

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          setup = Path(r"source/Project Files/Source/Console/setup.cs")
          raw, text = read(setup)
          text = once(
              text,
              "        private System.Windows.Forms.TabPage tpProcessedTXOutput;\n",
              "",
              "remove runtime tab field",
          )
          runtime_page_start = text.index(
              "            tpProcessedTXOutput = new System.Windows.Forms.TabPage();"
          )
          first_child = text.index(
              "            grpProcessedTXDevice = new System.Windows.Forms.GroupBoxTS();",
              runtime_page_start,
          )
          text = text[:runtime_page_start] + text[first_child:]
          text = once(
              text,
              "            tpProcessedTXOutput.Controls.Add(lblProcessedTXDescription);\n"
              "            EnsureProcessedTXOutputTab();\n",
              "            tpProcessedTXOutput.Controls.Add(lblProcessedTXDescription);\n",
              "remove runtime insertion call",
          )
          helper_start = text.index("        private void EnsureProcessedTXOutputTab()")
          next_method = text.index(
              "        private void PopulateProcessedTXOutputs(bool chooseUSBCodec)",
              helper_start,
          )
          text = text[:helper_start] + text[next_method:]
          if "EnsureProcessedTXOutputTab" in text:
              raise RuntimeError("Runtime tab reinsertion code remains")
          write(setup, raw, text)

          designer = Path(r"source/Project Files/Source/Console/setup.designer.cs")
          raw, text = read(designer)
          text = once(
              text,
              "            this.tpAudioOptions = new System.Windows.Forms.TabPage();\n",
              "            this.tpProcessedTXOutput = new System.Windows.Forms.TabPage();\n"
              "            this.tpAudioOptions = new System.Windows.Forms.TabPage();\n",
              "instantiate designer tab",
          )
          text = once(
              text,
              "            this.tcAudio.Controls.Add(this.tpVAC2);\n"
              "            this.tcAudio.Controls.Add(this.tpAudioOptions);\n",
              "            this.tcAudio.Controls.Add(this.tpVAC2);\n"
              "            this.tcAudio.Controls.Add(this.tpProcessedTXOutput);\n"
              "            this.tcAudio.Controls.Add(this.tpAudioOptions);\n",
              "add designer tab to audio pages",
          )
          tab_anchor = (
              "            this.tcAudio.TabIndex = 35;\n"
              "            // \n"
              "            // tpVAC\n"
          )
          tab_definition = (
              "            this.tcAudio.TabIndex = 35;\n"
              "            // \n"
              "            // tpProcessedTXOutput\n"
              "            // \n"
              "            this.tpProcessedTXOutput.Location = new System.Drawing.Point(4, 22);\n"
              "            this.tpProcessedTXOutput.Name = \"tpProcessedTXOutput\";\n"
              "            this.tpProcessedTXOutput.Padding = new System.Windows.Forms.Padding(3);\n"
              "            this.tpProcessedTXOutput.Size = new System.Drawing.Size(712, 404);\n"
              "            this.tpProcessedTXOutput.TabIndex = 6;\n"
              "            this.tpProcessedTXOutput.Text = \"TX Output\";\n"
              "            this.tpProcessedTXOutput.UseVisualStyleBackColor = true;\n"
              "            // \n"
              "            // tpVAC\n"
          )
          text = once(text, tab_anchor, tab_definition, "declare designer tab properties")
          text = once(
              text,
              "        private TabControl tcAudio;\n",
              "        private TabControl tcAudio;\n"
              "        private TabPage tpProcessedTXOutput;\n",
              "declare designer tab field",
          )
          write(designer, raw, text)

      - name: Commit corrected Branch D
        shell: pwsh
        run: |
          Set-Location source
          git diff --check
          $changed = @(git diff --name-only)
          $expectedFiles = @(
            'Project Files/Source/Console/setup.cs',
            'Project Files/Source/Console/setup.designer.cs'
          )
          if ($changed.Count -ne 2) { throw "Expected two changed files: $($changed -join ', ')" }
          foreach ($file in $expectedFiles) {
            if ($changed -notcontains $file) { throw "Missing expected change: $file" }
          }
          Select-String -Path 'Project Files/Source/Console/setup.designer.cs' -SimpleMatch 'this.tpProcessedTXOutput = new System.Windows.Forms.TabPage();'
          Select-String -Path 'Project Files/Source/Console/setup.designer.cs' -SimpleMatch 'this.tcAudio.Controls.Add(this.tpProcessedTXOutput);'
          Select-String -Path 'Project Files/Source/Console/setup.designer.cs' -SimpleMatch 'this.tpProcessedTXOutput.Text = "TX Output";'
          if (Select-String -Path 'Project Files/Source/Console/setup.cs' -SimpleMatch 'EnsureProcessedTXOutputTab') {
            throw 'Runtime reinsertion workaround remains in setup.cs'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'Project Files/Source/Console/setup.cs' 'Project Files/Source/Console/setup.designer.cs'
          git commit -m 'Declare dedicated TX Output page in Setup designer'
          $commit = (git rev-parse HEAD).Trim()
          git push origin HEAD:refs/heads/feature/dedicated-processed-tx-output
          "D_COMMIT=$commit" >> $env:GITHUB_ENV
          Write-Host "Corrected Branch D commit: $commit"

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $path) { throw 'MSBuild.exe not found' }
          "path=$path" >> $env:GITHUB_OUTPUT
          & $path -version

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Set-Location source
          nuget restore 'Project Files\Source\Thetis_VS2026.sln' -NonInteractive

      - name: Rebuild Release x64
        shell: pwsh
        run: |
          Set-Location source
          & "${{ steps.msbuild.outputs.path }}" 'Project Files\Source\Thetis_VS2026.sln' /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 /v:minimal /bl:publish-D-designer-fix.binlog

      - name: Package and verify designer-fixed executable
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'source\Project Files\bin\x64\Release'
          $exe = Join-Path $runtime 'Thetis.exe'
          if (-not (Test-Path $exe)) { throw "Thetis.exe not found at $exe" }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          $unicode = [System.Text.Encoding]::Unicode.GetString($bytes)
          if (-not $ascii.Contains('tpProcessedTXOutput')) {
            throw 'Designer TX Output tab field is not embedded in Thetis.exe'
          }
          if (-not $unicode.Contains('TX Output')) {
            throw 'TX Output UI label is not embedded in Thetis.exe'
          }

          $stage = Join-Path $PWD 'stage-D-designer-fix'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $runtime '*') -Destination $stage -Recurse -Force
          @"
          Thetis Hybrid SDR test state D — Setup designer fix
          Purpose: Independent processed TX output while VAC2 remains available for RX2.
          Source branch: feature/dedicated-processed-tx-output
          Source commit: $env:D_COMMIT
          Build: GitHub Actions full Release x64 rebuild.
          UI fix: TX Output is declared in setup.designer.cs and added during InitializeComponent().
          Hardware status: Build verified; Red Pitaya / IC-7100 validation pending.
          Controls: Setup -> Audio -> TX Output.
          Run Thetis.exe directly from this extracted folder.
          "@ | Set-Content -Path (Join-Path $stage 'BUILD-INFO.txt') -Encoding UTF8

          $filename = 'Thetis-HybridSDR-D-Dedicated-TX-Output-Designer-Fix-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $filename -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $filename))
          try {
            $rootExe = $zip.Entries | Where-Object { $_.FullName -eq 'Thetis.exe' }
            $buildInfo = $zip.Entries | Where-Object { $_.FullName -eq 'BUILD-INFO.txt' }
            if (-not $rootExe -or -not $buildInfo) { throw 'ZIP root verification failed' }
            Write-Host "ZIP entries: $($zip.Entries.Count); Thetis.exe length: $($rootExe.Length)"
          } finally {
            $zip.Dispose()
          }
          Get-FileHash $filename -Algorithm SHA256 | Format-List

      - name: Upload corrected package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-sdr-state-D-designer-fix
          path: Thetis-HybridSDR-D-Dedicated-TX-Output-Designer-Fix-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish designer-fixed D asset and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'hybrid-sdr-testset-2026-09-03'
          $repo = $env:GITHUB_REPOSITORY
          $newD = 'Thetis-HybridSDR-D-Dedicated-TX-Output-Designer-Fix-x64.zip'
          $staleD = @(
            'Thetis-HybridSDR-D-Dedicated-TX-Output-x64.zip',
            'Thetis-HybridSDR-D-Dedicated-TX-Output-UI-Fix-x64.zip'
          )

          gh release upload $tag $newD --clobber --repo $repo

          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item $newD (Join-Path $dist $newD)
          gh release download $tag --repo $repo --dir $dist --pattern 'Thetis-HybridSDR-A-Untouched-x64.zip'
          gh release download $tag --repo $repo --dir $dist --pattern 'Thetis-HybridSDR-B-Phase1-Diagnostic-x64.zip'
          gh release download $tag --repo $repo --dir $dist --pattern 'Thetis-HybridSDR-C-Phase2-Complete-x64.zip'

          $lines = Get-ChildItem $dist -Filter '*.zip' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $sums = Join-Path $dist 'Thetis-HybridSDR-SHA256SUMS.txt'
          $lines | Set-Content -Path $sums -Encoding ASCII
          Get-Content $sums
          gh release upload $tag $sums --clobber --repo $repo

          $assetNames = @(gh release view $tag --repo $repo --json assets --jq '.assets[].name')
          foreach ($old in $staleD) {
            if ($assetNames -contains $old) {
              gh release delete-asset $tag $old --yes --repo $repo
            }
          }

          @"
          Experimental test set for the Red Pitaya RX + Thetis DSP + IC-7100 RF TX project.

          No compilation is required. Extract each ZIP into a separate folder and run Thetis.exe.

          **A — Untouched control**
          master @ 852bf0ef0b4f3886a13fc2846489aee16f361872

          **B — Phase 1 diagnostic**
          feature/independent-tx-audio-routing-phase1 @ 591ee826db17acef1df6caed40d3bbe68251ad55

          **C — VAC2 processed-TX implementation**
          feature/independent-tx-audio-routing @ 5153394ce829f5979c44cae626789ebdb3455d9e

          **D — Dedicated processed-TX output; VAC2 remains standard**
          feature/dedicated-processed-tx-output @ $env:D_COMMIT

          D has been rebuilt with TX Output declared in the normal Setup designer/build path. Configure the external transmitter under Setup -> Audio -> TX Output. VAC1 remains available for microphone input and VAC2 remains available for its normal RX2/second-receiver role.

          Corrected D download: $newD

          This is an experimental fork/test set, not an official Thetis release.
          "@ | Set-Content -Path release-notes.md -Encoding UTF8

          gh release edit $tag --title 'Hybrid SDR A/B/C/D hardware test set — 2026-09-03' --notes-file release-notes.md --prerelease --repo $repo
