name: Build and publish Hybrid SDR Branch D

on:
  push:
    branches:
      - ci/baseline-build
    paths:
      - .github/workflows/publish-hybrid-sdr-d.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Create Branch D
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Checkout corrected Branch C base
        uses: actions/checkout@v4
        with:
          ref: 5153394ce829f5979c44cae626789ebdb3455d9e
          fetch-depth: 0
          path: source

      - name: Apply the reviewed Branch D patch
        env:
          BRANCH_D_PATCH: 
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BRANCH_D_PATCH" | base64 --decode | gzip -d > /tmp/branch-d.patch
          cd source
          git apply --check /tmp/branch-d.patch
          git apply /tmp/branch-d.patch
          test "$(git diff --name-only | wc -l)" -eq 5
          git diff --name-only
          if grep -R -n -E --include='*.cs' --include='*.c' --include='*.h' \
            'VAC2ProcessedTXOutput|vac2_processed_tx_output|comboVAC2OperatingMode' 'Project Files/Source'; then
            echo 'Branch C VAC2 repurposing code is still present.' >&2
            exit 1
          fi
          grep -n 'ProcessedTXOutputEnabled' 'Project Files/Source/Console/audio.cs'
          grep -n 'tpProcessedTXOutput' 'Project Files/Source/Console/setup.cs'
          grep -n -F 'xvacOUT(pcm->cmRCVR, 2' 'Project Files/Source/ChannelMaster/pipe.c'

      - name: Commit and push Branch D
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B feature/dedicated-processed-tx-output
          git add \
            'Project Files/Source/ChannelMaster/cmaster.c' \
            'Project Files/Source/ChannelMaster/pipe.c' \
            'Project Files/Source/Console/audio.cs' \
            'Project Files/Source/Console/console.cs' \
            'Project Files/Source/Console/setup.cs'
          git commit -m 'Add independent processed TX audio output'
          commit_sha="$(git rev-parse HEAD)"
          git fetch origin feature/dedicated-processed-tx-output || true
          if git show-ref --verify --quiet refs/remotes/origin/feature/dedicated-processed-tx-output; then
            remote_sha="$(git rev-parse refs/remotes/origin/feature/dedicated-processed-tx-output)"
            git push --force-with-lease=refs/heads/feature/dedicated-processed-tx-output:${remote_sha} \
              origin HEAD:refs/heads/feature/dedicated-processed-tx-output
          else
            git push origin HEAD:refs/heads/feature/dedicated-processed-tx-output
          fi
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "Branch D commit: ${commit_sha}"

  build:
    name: Build Branch D x64
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Checkout exact Branch D commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          path: source

      - name: Verify source and independent route
        shell: pwsh
        run: |
          Push-Location source
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ needs.prepare.outputs.commit_sha }}') {
            throw "Expected ${{ needs.prepare.outputs.commit_sha }}, got $actual"
          }
          $forbidden = Get-ChildItem 'Project Files\Source' -Recurse -File -Include *.cs,*.c,*.h |
            Select-String -Pattern 'VAC2ProcessedTXOutput|vac2_processed_tx_output|comboVAC2OperatingMode'
          if ($forbidden) { throw 'VAC2 repurposing identifiers remain in Branch D.' }
          Select-String -Path 'Project Files\Source\Console\setup.cs' -Pattern 'tpProcessedTXOutput'
          Select-String -Path 'Project Files\Source\ChannelMaster\pipe.c' -Pattern 'xvacOUT\(pcm->cmRCVR, 2'
          Pop-Location

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $path) { throw 'MSBuild.exe not found' }
          "path=$path" >> $env:GITHUB_OUTPUT
          & $path -version

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Push-Location source
          nuget restore 'Project Files\Source\Thetis_VS2026.sln' -NonInteractive
          Pop-Location

      - name: Build Release x64
        shell: pwsh
        run: |
          Push-Location source
          & "${{ steps.msbuild.outputs.path }}" 'Project Files\Source\Thetis_VS2026.sln' /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal /bl:publish-D.binlog
          Pop-Location

      - name: Package ready-to-run ZIP
        shell: pwsh
        run: |
          $runtime = Join-Path $PWD 'source\Project Files\bin\x64\Release'
          $exe = Join-Path $runtime 'Thetis.exe'
          if (-not (Test-Path $exe)) { throw "Thetis.exe not found at $exe" }
          $stage = Join-Path $PWD 'stage-D'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path (Join-Path $runtime '*') -Destination $stage -Recurse -Force
          @"
          Thetis Hybrid SDR test state D
          Purpose: Independent processed TX output while VAC2 remains available for RX2.
          Source branch: feature/dedicated-processed-tx-output
          Source commit: ${{ needs.prepare.outputs.commit_sha }}
          Build: GitHub Actions Release x64 publication build.
          Hardware status: Build verified; Red Pitaya / IC-7100 validation pending.
          Controls: Setup -> Audio -> TX Output.
          Run Thetis.exe directly from this extracted folder.
          "@ | Set-Content -Path (Join-Path $stage 'BUILD-INFO.txt') -Encoding UTF8
          $filename = 'Thetis-HybridSDR-D-Dedicated-TX-Output-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $filename -CompressionLevel Optimal
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $filename))
          try {
            $rootExe = $zip.Entries | Where-Object { $_.FullName -eq 'Thetis.exe' }
            if (-not $rootExe) { throw 'Thetis.exe is not at ZIP root' }
            Write-Host "ZIP contains $($zip.Entries.Count) entries; root Thetis.exe length $($rootExe.Length)"
          } finally { $zip.Dispose() }
          Get-FileHash $filename -Algorithm SHA256 | Format-List

      - name: Upload Branch D package
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-sdr-state-D
          path: Thetis-HybridSDR-D-Dedicated-TX-Output-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-sdr-buildlog-D
          path: source/publish-D.binlog
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: Add Branch D to GitHub prerelease
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Branch D package
        uses: actions/download-artifact@v4
        with:
          name: hybrid-sdr-state-D
          path: dist

      - name: Download existing A, B, and C packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='hybrid-sdr-testset-2026-09-03'
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'Thetis-HybridSDR-A-Untouched-x64.zip' \
            --pattern 'Thetis-HybridSDR-B-Phase1-Diagnostic-x64.zip' \
            --pattern 'Thetis-HybridSDR-C-Phase2-Complete-x64.zip'
          test -f dist/Thetis-HybridSDR-A-Untouched-x64.zip
          test -f dist/Thetis-HybridSDR-B-Phase1-Diagnostic-x64.zip
          test -f dist/Thetis-HybridSDR-C-Phase2-Complete-x64.zip
          test -f dist/Thetis-HybridSDR-D-Dedicated-TX-Output-x64.zip
          (cd dist && sha256sum Thetis-HybridSDR-*.zip > Thetis-HybridSDR-SHA256SUMS.txt)
          cat dist/Thetis-HybridSDR-SHA256SUMS.txt

      - name: Publish Branch D and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='hybrid-sdr-testset-2026-09-03'
          title='Hybrid SDR A/B/C/D hardware test set — 2026-09-03'
          cat > release-notes.md <<'EOF'
          Experimental test set for the Red Pitaya RX + Thetis DSP + IC-7100 RF TX project.

          No compilation is required. Extract each ZIP into a separate folder and run Thetis.exe.

          **A — Untouched control**  
          master @ 852bf0ef0b4f3886a13fc2846489aee16f361872

          **B — Phase 1 diagnostic**  
          feature/independent-tx-audio-routing-phase1 @ 591ee826db17acef1df6caed40d3bbe68251ad55

          **C — VAC2 processed-TX implementation**  
          feature/independent-tx-audio-routing @ 5153394ce829f5979c44cae626789ebdb3455d9e

          **D — Dedicated processed-TX output; VAC2 remains standard**  
          feature/dedicated-processed-tx-output @ BRANCH_D_COMMIT

          A, B, and corrected C have been exercised on the Red Pitaya / IC-7100 setup. D has passed the complete Windows Release x64 build and ZIP verification; its new independent audio route still requires hardware validation.

          In D, configure the external transmitter under Setup → Audio → TX Output. VAC1 remains available for microphone input and VAC2 remains available for its normal RX2/second-receiver role. The new output includes Enable, Driver, Output, Buffer Size, Sample Rate, TX gain, and WASAPI Exclusive Out controls.

          This is an experimental fork/test set, not an official Thetis release.
          EOF
          sed -i "s/BRANCH_D_COMMIT/${{ needs.prepare.outputs.commit_sha }}/" release-notes.md
          gh release upload "$tag" \
            dist/Thetis-HybridSDR-D-Dedicated-TX-Output-x64.zip \
            dist/Thetis-HybridSDR-SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --title "$title" --notes-file release-notes.md --prerelease --repo "$GITHUB_REPOSITORY"
