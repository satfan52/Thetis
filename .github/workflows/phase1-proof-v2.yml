name: Phase 1 proof build v2

on:
  push:
    branches:
      - ci/baseline-build
  workflow_dispatch:

jobs:
  phase1:
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@v4

      - name: Checkout pristine feature source
        uses: actions/checkout@v4
        with:
          ref: feature/independent-tx-audio-routing
          path: source

      - name: Apply Phase 1 proof patch
        shell: pwsh
        run: |
          python .github/scripts/phase1_proof_patch.py
          Set-Location source
          git diff --check
          git diff --stat
          git diff -- "Project Files/Source/Console/audio.cs"
          $changed = @(git status --porcelain)
          if ($changed.Count -ne 1) { throw "Expected exactly one changed file, got $($changed.Count)" }

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $path) { throw "MSBuild.exe not found" }
          "path=$path" >> $env:GITHUB_OUTPUT
          & $path -version

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          Set-Location source
          nuget restore "Project Files\Source\Thetis_VS2026.sln" -NonInteractive

      - name: Build Phase 1 Release x64
        shell: pwsh
        run: |
          Set-Location source
          & "${{ steps.msbuild.outputs.path }}" "Project Files\Source\Thetis_VS2026.sln" /m /t:Build /p:Configuration=Release /p:Platform=x64 /v:minimal /bl:phase1.binlog

      - name: Upload Phase 1 binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: thetis-phase1-vac2-processed-tx-proof
          path: |
            source/Project Files/bin/x64/Release/**
            source/Project Files/build/x64/Release/**
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-proof-diagnostics
          path: |
            source/phase1.binlog
            source/Project Files/Source/Console/audio.cs
          if-no-files-found: ignore
