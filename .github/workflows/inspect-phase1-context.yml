name: Inspect VAC2 lower-right layout

on:
  push:
    branches:
      - ci/baseline-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print VAC2 lower-right control layout
        shell: python
        run: |
          from pathlib import Path
          lines=Path('Project Files/Source/Console/setup.designer.cs').read_text(encoding='utf-8-sig', errors='replace').splitlines()
          needles=['ucVAC2VARGrapherIn.Location','ucVAC2VARGrapherIn.Size','ucVAC2VARGrapherOut.Location','ucVAC2VARGrapherOut.Size','udVAC2GrapherSwing.Location','udVAC2GrapherSwing.Size','chkVAC2GrapherAuto.Location','chkVAC2onSplit.Location']
          for needle in needles:
              for i,line in enumerate(lines,1):
                  if needle in line:
                      print(f'{i:6}: {line.strip()}')
