name: Inspect Phase 1 setup lifecycle

on:
  workflow_dispatch:
  push:
    branches: [ci/baseline-build]
    paths: [.github/workflows/inspect-phase1-context.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate VAC2 parent container
        shell: python
        run: |
          from pathlib import Path
          lines=Path('Project Files/Source/Console/setup.designer.cs').read_text(encoding='utf-8-sig', errors='replace').splitlines()
          needles=['Controls.Add(this.grpVAC2Gain)', 'Controls.Add(this.grpAudioDetails3)', 'Controls.Add(this.chkVAC2Combine)', 'Controls.Add(this.chkVAC2UseRX2)', 'Controls.Add(this.grpVAC2LatencyManual)']
          for needle in needles:
              for i,line in enumerate(lines,1):
                  if needle in line:
                      print(f'--- {needle} at {i} ---')
                      for n in range(max(1,i-25), min(len(lines),i+25)+1): print(f'{n:6}: {lines[n-1]}')
